project_id = "kanvas-auth"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://www.kanvas-it.com"
additional_redirect_urls = [
  "https://www.kanvas-it.com/**",
  "https://kanvas-it.com/**",
  "http://localhost:5173/**",
  "http://localhost:3000/**"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.paystack-initialize]
verify_jwt = true

[functions.paystack-webhook]
verify_jwt = false

[functions.desktop]
verify_jwt = false

[functions.redeem-key]
verify_jwt = true

[functions.license-admin]
verify_jwt = true
